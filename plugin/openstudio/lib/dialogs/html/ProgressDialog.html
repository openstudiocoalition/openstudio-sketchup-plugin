<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OpenStudio Progress</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .container {
    width: 100%;
    padding: 0 16px;
  }
  #title {
    margin-bottom: 6px;
    font-weight: 600;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track {
    background: #ddd;
    border-radius: 4px;
    height: 16px;
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 0%;
    background: #0078d4;
    border-radius: 4px;
    transition: width 0.1s ease, background 0.2s ease;
  }
  #bar.success {
    background: #4bb543;
  }
  #pct {
    margin-top: 4px;
    color: #555;
    text-align: right;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="container">
    <div id="title"></div>
    <div class="bar-track"><div id="bar"></div></div>
    <div id="pct">0%</div>
  </div>
  <script>
    function setProgress(title, percentage) {
      document.getElementById('title').textContent = title;
      var pct = Math.min(100, Math.max(0, percentage));
      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('bar').classList.remove('success');
      document.getElementById('pct').textContent = Math.round(pct) + '%';
    }
    function setDone() {
      document.getElementById('bar').style.width = '100%';
      document.getElementById('bar').classList.add('success');
      document.getElementById('pct').textContent = '100%';
    }
  </script>
</body>
</html>
